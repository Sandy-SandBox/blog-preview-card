<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <!-- Google Fonts: Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <!-- Blog Card -->
    <main>
      <article class="blog">
        <figure class="blog__img">
          <img
            src="assets/images/illustration-article.svg"
            alt="Abstract illustration image"
          />
        </figure>

        <div class="blog__content">
          <span class="blog__category">Learning</span>
          <p class="blog__date">
            Published <time datetime="2023-12-21">21 Dec 2023</time>
          </p>
          <h1 class="blog__title">HTML & CSS foundations</h1>
          <p class="blog__description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>

          <address class="blog__author">
            <img
              src="assets/images/image-avatar.webp"
              alt="Photo of author Greg Hooper"
              class="blog__author-img"
            />
            <p class="blog__author-name" role="author">Greg Hooper</p>
          </address>
        </div>
      </article>
    </main>

    <!-- Footer -->
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Sushant kumar tiwari</a>.
    </footer>
  </body>
</html>
